<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;

        --bg: #141414;
        --raise: #1e1e1e;
        --line: #2a2a2a;
        --line-soft: #222;
        --edge: rgba(255, 255, 255, 0.09);

        --text: #f1eeeb;
        --dim: #8d8b89;

        /* White carries the emphasis; red is reserved for ending a session. */
        --accent: #ffffff;
        --accent-dim: #e4e1de;
        --on-accent: #121212;
        --danger: #e83745;
        --danger-bright: #f04d5a;
        --error: #ff8d97;

        --r-card: 16px;
        --r-lg: 12px;
        --r: 10px;
        --r-sm: 6px;
      }

      * { box-sizing: border-box; }

      /* Flex containers would otherwise out-specify the UA rule for [hidden]. */
      [hidden] { display: none !important; }

      /* Transparent behind the card, so its rounded corners are the popup's
         corners and nothing draws a square around them. */
      html { background: transparent; }

      body {
        width: 336px;
        margin: 0;
        background: transparent;
        color: var(--text);
        font: 14px/20px "SF Pro", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", sans-serif;
      }

      .card {
        overflow: hidden;
        border-radius: var(--r-card);
        background: var(--bg);
      }

      /* ----- header: no chrome of its own, just the name and a re-check ----- */

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 14px 16px 0;
      }

      .bar__name {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--dim);
        font-size: 12px;
        line-height: 16px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-weight: 600;
      }

      .dot {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--error);
        transition: background 160ms ease;
      }

      .dot[data-up="true"] { background: var(--accent); }

      .icon-button {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        padding: 0;
        border: 0;
        border-radius: var(--r-sm);
        background: transparent;
        color: var(--dim);
        cursor: pointer;
        transition: background 120ms ease, color 120ms ease;
      }

      .icon-button:hover:not(:disabled) { background: var(--raise); color: var(--text); }
      .icon-button:disabled { opacity: 0.35; cursor: default; }
      .icon-button svg { width: 14px; height: 14px; }
      .icon-button[data-busy="true"] svg { animation: spin 700ms linear infinite; }

      @keyframes spin { to { transform: rotate(360deg); } }

      main {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
        padding: 14px 16px 16px;
      }

      /* ----- the one loud element in the popup ----- */

      .toggle {
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: var(--r-lg);
        background: var(--accent);
        color: var(--on-accent);
        cursor: pointer;
        font: inherit;
        font-size: 15px;
        line-height: 22px;
        letter-spacing: -0.01em;
        font-weight: 600;
        transition: opacity 120ms ease, transform 120ms ease, background 120ms ease,
          color 120ms ease;
      }

      .toggle:hover:not(:disabled) { background: var(--accent-dim); }
      .toggle:active:not(:disabled) { transform: scale(0.985); }
      /* Disabled goes quiet rather than translucent: 30% white is still a slab. */
      .toggle:disabled {
        background: var(--raise);
        color: #5f5d5b;
        box-shadow: inset 0 0 0 1px var(--line);
        cursor: default;
      }

      /* Running: red, because the only thing left to do is stop. */
      .toggle[data-on="true"] {
        background: var(--danger);
        color: #fff;
      }

      .toggle[data-on="true"]:hover:not(:disabled) { background: var(--danger-bright); }

      .state {
        margin: -6px 0 0;
        color: var(--dim);
        font-size: 12.5px;
        line-height: 18px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .state[data-tone="error"] { color: var(--error); }

      /* ----- pairing: a row, not a card. Once paired it collapses to a line ----- */

      /* Grid and flex children default to min-width:auto, which lets a long
         line or the input's intrinsic width push past the popup's edge. */
      .pair, .pair > * { min-width: 0; }

      .pair {
        display: grid;
        gap: 10px;
        padding-top: 14px;
        border-top: 1px solid var(--line-soft);
      }

      .pair__form { display: flex; gap: 8px; }

      .pair__input {
        min-width: 0;
        width: 100%;
        flex: 1 1 0;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: var(--r);
        outline: 0;
        background: var(--raise);
        color: var(--text);
        font: 12px/16px ui-monospace, "SFMono-Regular", monospace;
        letter-spacing: 0.02em;
        transition: border-color 120ms ease;
      }

      .pair__input::placeholder { color: #6b6967; letter-spacing: 0; }
      .pair__input:focus { border-color: var(--accent); }

      .pair__button {
        padding: 9px 14px;
        border: 1px solid var(--line);
        border-radius: var(--r);
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
      }

      .pair__button:hover:not(:disabled) {
        background: var(--raise);
        border-color: var(--edge);
        color: var(--accent);
      }

      .pair__button:disabled { opacity: 0.35; cursor: default; }

      .pair__line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .pair__state {
        margin: 0;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--error);
        font-size: 12.5px;
        line-height: 18px;
      }

      .pair__state[data-paired="true"] { color: var(--text); }

      .pair__ghost {
        flex: none;
        padding: 4px 8px;
        border: 0;
        border-radius: var(--r-sm);
        background: transparent;
        color: var(--dim);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        line-height: 16px;
        transition: background 120ms ease, color 120ms ease;
      }

      .pair__ghost:hover { background: var(--raise); color: var(--text); }

      /* ----- shortcuts ----- */

      .keys {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 0;
        padding-top: 14px;
        border-top: 1px solid var(--line-soft);
      }

      .keys__row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .keys__row > span:first-child {
        color: var(--dim);
        font-size: 12.5px;
        line-height: 18px;
      }

      .keys__combo { display: flex; align-items: center; gap: 4px; }

      kbd {
        padding: 2px 7px;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: var(--raise);
        color: var(--dim);
        font: inherit;
        font-size: 11px;
        line-height: 15px;
        letter-spacing: 0.02em;
        font-weight: 500;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="card">
    <header class="bar">
      <span class="bar__name"><span class="dot" id="dot"></span>Nudge</span>
      <button class="icon-button" id="refresh" type="button" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 12a8 8 0 0 1-13.7 5.6L4 15" />
          <path d="M4 20v-5h5" />
          <path d="M4 12A8 8 0 0 1 17.7 6.4L20 9" />
          <path d="M20 4v5h-5" />
        </svg>
      </button>
    </header>

    <main>
      <button class="toggle" id="toggle" disabled>Start session</button>
      <p class="state" id="status">Checking the daemon…</p>

      <section class="pair">
        <div class="pair__form" id="pairing-form">
          <input
            class="pair__input"
            id="pairing-code"
            type="password"
            autocomplete="off"
            spellcheck="false"
            aria-label="Daemon pairing code"
            placeholder="Paste 32-character code"
          />
          <button class="pair__button" id="pair" type="button">Pair</button>
        </div>
        <div class="pair__line">
          <p class="pair__state" id="pairing-state">Not paired</p>
          <button class="pair__ghost" id="replace" type="button" hidden>Replace</button>
        </div>
      </section>

      <section class="keys">
        <div class="keys__row">
          <span>Start / end session</span>
          <span class="keys__combo" id="shortcut"><kbd>—</kbd></span>
        </div>
        <div class="keys__row">
          <span>Annotate on / off</span>
          <span class="keys__combo" id="annotate-key"><kbd>—</kbd></span>
        </div>
        <div class="keys__row">
          <span>Add selection</span>
          <span class="keys__combo"><kbd>Enter</kbd></span>
        </div>
        <div class="keys__row">
          <span>Stop annotating</span>
          <span class="keys__combo"><kbd>Esc</kbd></span>
        </div>
      </section>
    </main>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
