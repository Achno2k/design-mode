<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #191a19;
        --bg-raised: #252725;
        --text: #f1f2ed;
        --text-dim: #a1a49c;
        --text-faint: #6f736b;
        --accent: #7c9cff;
        --green: #72d5a7;
        --red: #ff7c7c;
      }

      * { box-sizing: border-box; }

      body {
        width: 286px;
        margin: 0;
        padding: 19px 18px 17px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 "Avenir Next", Avenir, ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
      }

      .title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 21px;
        color: var(--text);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .title::before {
        width: 7px;
        height: 7px;
        border-radius: 2px;
        background: var(--accent);
        content: '';
        transform: rotate(12deg);
      }

      .state {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 20px;
      }

      .dot {
        flex: none;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 0 3px rgba(255, 124, 124, 0.09);
      }

      .dot[data-up="true"] {
        background: var(--green);
        box-shadow: 0 0 0 3px rgba(114, 213, 167, 0.09);
      }

      .state__text {
        min-width: 0;
        overflow: hidden;
        color: var(--text-dim);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .toggle {
        width: 100%;
        margin-top: 14px;
        padding: 9px 12px;
        border: 0;
        border-radius: 9px;
        background: var(--text);
        color: #151615;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        transition: background 120ms, color 120ms, transform 120ms;
      }

      .toggle:hover:not(:disabled) { background: #fff; }
      .toggle:active:not(:disabled) { transform: scale(0.985); }
      .toggle:disabled { opacity: 0.34; cursor: default; }

      .toggle[data-on="true"] {
        background: var(--bg-raised);
        color: var(--text-dim);
      }

      .toggle[data-on="true"]:hover { background: #2c2e2c; color: var(--text); }

      .keys {
        display: flex;
        flex-direction: column;
        gap: 0;
        margin: 18px 0 0;
      }

      .keys__row {
        display: flex;
        min-height: 27px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--text-faint);
        font-size: 11px;
      }

      kbd {
        padding: 0;
        background: transparent;
        color: var(--text-dim);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 10.5px;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <p class="title">herdr design mode</p>

    <div class="state">
      <span class="dot" id="dot"></span>
      <span class="state__text" id="status">Checking the daemon…</span>
    </div>

    <button class="toggle" id="toggle" disabled>Turn on</button>

    <dl class="keys">
      <div class="keys__row"><span>Start / end session</span><kbd id="shortcut">—</kbd></div>
      <div class="keys__row"><span>Annotate on / off</span><kbd id="annotate-key">—</kbd></div>
      <div class="keys__row"><span>Add selection</span><kbd>Enter</kbd></div>
      <div class="keys__row"><span>Stop annotating</span><kbd>Esc</kbd></div>
    </dl>

    <script type="module" src="popup.js"></script>
  </body>
</html>
